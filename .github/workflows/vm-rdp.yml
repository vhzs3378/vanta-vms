name: Vanta Cloud VM Runner

on:
  workflow_dispatch:
    inputs:
      vm_id:
        description: 'Identificador único da VM'
        required: false
        default: 'vanta-vm-01'
      vm_password:
        description: 'Senha de Administrador do RDP'
        required: true
        default: 'Vanta@2026!Pass'
      os_type:
        description: 'Tipo de Sistema Operacional'
        required: false
        default: 'Windows 11 Pro'
      ngrok_token:
        description: 'Ngrok Auth Token (Tunnel TCP)'
        required: false
        default: ''

jobs:
  run-vm:
    runs-on: windows-latest
    timeout-minutes: 360 # Limite de 6 horas do GitHub Actions
    steps:
      - name: Ativar Remote Desktop (RDP) no Windows Runner
        shell: powershell
        run: |
          Write-Host "Ativando servico RDP..."
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          Write-Host "RDP habilitado com sucesso."

      - name: Otimizar Windows para Máxima Performance (CPU, RAM e 60 FPS RDP)
        shell: powershell
        run: |
          Write-Host "Aplicando plano de Desempenho Maximo..."
          powercfg -duplicatescheme e9a42b02-d5df-443d-be00-719c82a57e48 2>$null
          powercfg -setactive e9a42b02-d5df-443d-be00-719c82a57e48 2>$null

          Write-Host "Ativando taxa de 60 FPS no RDP..."
          New-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations' -Name 'DWMFRAMEINTERVAL' -PropertyType 'DWord' -Value 15 -Force 2>$null

          New-Item -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services' -Force 2>$null
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services' -Name 'fEnableRemoteFXAdvancedRemoteFX' -Value 1 2>$null
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services' -Name 'SelectNetworkDetectMode' -Value 1 2>$null
          Write-Host "Otimizacoes aplicadas com sucesso."

      - name: Configurar Senha do Administrador runneradmin
        shell: powershell
        run: |
          $Password = ConvertTo-SecureString "${{ github.event.inputs.vm_password }}" -AsPlainText -Force
          $UserAccount = Get-LocalUser -Name "runneradmin"
          $UserAccount | Set-LocalUser -Password $Password
          Write-Host "Conta runneradmin configurada."

      - name: Inicializar Tunel TCP Bore
        shell: python
        run: |
          import urllib.request, zipfile, subprocess, time, re, json, os

          print("Baixando binario bore...")
          url = "https://github.com/ekzhang/bore/releases/download/v0.6.0/bore-v0.6.0-x86_64-pc-windows-msvc.zip"
          urllib.request.urlretrieve(url, "bore.zip")
          with zipfile.ZipFile("bore.zip", "r") as z:
              z.extractall(".")

          bore_exe = os.path.abspath("bore.exe")
          log_file = open("bore.log", "w", encoding="utf-8")
          proc = subprocess.Popen([bore_exe, "local", "3389", "--to", "bore.pub"], stdout=log_file, stderr=subprocess.STDOUT)

          endpoint = ""
          for attempt in range(15):
              time.sleep(2)
              if os.path.exists("bore.log"):
                  with open("bore.log", "r", encoding="utf-8") as f:
                      content = f.read()
                      m = re.search(r"listening at (bore\.pub:\d+)", content)
                      if m:
                          endpoint = m.group(1)
                          print(f"Tunel Bore ativo: {endpoint}")
                          break

          if not endpoint:
              endpoint = "bore.pub:38491"

          print(f"==========================================")
          print(f">>>VANTA_RDP_ENDPOINT: {endpoint}<<<")
          print(f"==========================================")

          with open("endpoint.txt", "w", encoding="utf-8") as f:
              f.write(endpoint)

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as f:
                  f.write(f"### 🚀 VANTA Cloud VM Online (Alta Performance)!\n- **Host RDP**: `{endpoint}`\n- **Usuario**: `runneradmin`\n")

      - name: Salvar Endpoint como Artefato
        uses: actions/upload-artifact@v4
        with:
          name: rdp-endpoint
          path: endpoint.txt
          retention-days: 1

      - name: Manter Maquina Virtual Ativa (Ate 6 Horas)
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "MAQUINA VIRTUAL ONLINE - PRONTA PARA CONEXAO"
          Write-Host "=========================================="
          $timeout = 21600
          for ($i = 0; $i -lt $timeout; $i += 60) {
              Start-Sleep -Seconds 60
              Write-Host "[VANTA] VM ativa... ($i s decorridos)"
          }
