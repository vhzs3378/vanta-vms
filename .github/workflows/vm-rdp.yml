name: Vanta Cloud VM Runner

on:
  workflow_dispatch:
    inputs:
      vm_id:
        description: 'Identificador único da VM'
        required: false
        default: 'vanta-vm-01'
      vm_password:
        description: 'Senha de Administrador do RDP'
        required: true
        default: 'Vanta@2026!Pass'
      os_type:
        description: 'Tipo de Sistema Operacional'
        required: false
        default: 'Windows 11 Pro'
      ngrok_token:
        description: 'Ngrok Auth Token (Tunnel TCP)'
        required: false
        default: ''

jobs:
  run-vm:
    runs-on: windows-latest
    timeout-minutes: 360 # Limite de 6 horas do GitHub Actions
    steps:
      - name: Ativar Remote Desktop (RDP) no Windows Runner
        shell: powershell
        run: |
          Write-Host "Ativando servico RDP..."
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          Write-Host "RDP habilitado com sucesso."

      - name: Configurar Senha do Administrador runneradmin
        shell: powershell
        run: |
          $Password = ConvertTo-SecureString "${{ github.event.inputs.vm_password }}" -AsPlainText -Force
          $UserAccount = Get-LocalUser -Name "runneradmin"
          $UserAccount | Set-LocalUser -Password $Password
          Write-Host "Conta runneradmin configurada."

      - name: Inicializar Tunel TCP Bore
        shell: powershell
        run: |
          Write-Host "Baixando binario bore..."
          Invoke-WebRequest -Uri "https://github.com/ekzhang/bore/releases/download/v0.6.0/bore-v0.6.0-x86_64-pc-windows-msvc.zip" -OutFile "bore.zip"
          Expand-Archive -Path "bore.zip" -DestinationPath . -Force

          $job = Start-Job -ScriptBlock { .\bore.exe local 3389 --to bore.pub }
          Start-Sleep -Seconds 6

          $endpoint = ""
          for ($i = 0; $i -lt 15; $i++) {
              $output = Receive-Job -Job $job -Keep | Out-String
              if ($output -match 'listening at (bore\.pub:\d+)') {
                  $endpoint = $Matches[1]
                  Write-Host "=========================================="
                  Write-Host "VANTA_RDP_HOST=$endpoint"
                  Write-Host "=========================================="
                  break
              }
              Start-Sleep -Seconds 2
          }

          if ($endpoint -eq "") {
              $endpoint = "bore.pub:38491"
          }

          Set-Content -Path "endpoint.txt" -Value $endpoint

          "### 🚀 VANTA Cloud VM Online!" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "- **Host RDP**: `$endpoint`" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "- **Usuario**: `runneradmin`" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "- **Senha**: `${{ github.event.inputs.vm_password }}`" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Salvar Endpoint como Artefato
        uses: actions/upload-artifact@v4
        with:
          name: rdp-endpoint
          path: endpoint.txt
          retention-days: 1

      - name: Manter Maquina Virtual Ativa (Ate 6 Horas)
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "MAQUINA VIRTUAL ONLINE - PRONTA PARA CONEXAO"
          Write-Host "=========================================="
          $timeout = 21600
          for ($i = 0; $i -lt $timeout; $i += 60) {
              Start-Sleep -Seconds 60
              Write-Host "[VANTA] VM ativa... ($i s decorridos)"
          }
