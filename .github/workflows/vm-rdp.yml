name: Vanta Cloud VM Runner

on:
  workflow_dispatch:
    inputs:
      vm_id:
        description: 'Identificador único da VM'
        required: false
        default: 'vanta-vm-01'
      vm_password:
        description: 'Senha de Administrador do RDP'
        required: true
        default: 'Vanta@2026!Pass'
      os_type:
        description: 'Tipo de Sistema Operacional'
        required: false
        default: 'Windows 11 Pro'
      ngrok_token:
        description: 'Ngrok Auth Token (Tunnel TCP)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  run-vm:
    runs-on: windows-latest
    timeout-minutes: 360 # Limite de 6 horas do GitHub Actions
    steps:
      - name: Checkout Repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Ativar Remote Desktop (RDP) no Windows Runner
        shell: powershell
        run: |
          Write-Host "Configurando Terminal Server e Firewall..."
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          Write-Host "Serviço RDP configurado na porta 3389."

      - name: Configurar Senha do Administrador runneradmin
        shell: powershell
        run: |
          $Password = ConvertTo-SecureString "${{ github.event.inputs.vm_password }}" -AsPlainText -Force
          $UserAccount = Get-LocalUser -Name "runneradmin"
          $UserAccount | Set-LocalUser -Password $Password
          Write-Host "Conta runneradmin atualizada com a senha informada."

      - name: Inicializar Túnel TCP (Ngrok) e Salvar Endpoint
        shell: powershell
        run: |
          $ngrokToken = "${{ github.event.inputs.ngrok_token }}"
          $vmId = "${{ github.event.inputs.vm_id }}"

          if ($ngrokToken -eq "") {
              $ngrokToken = "3KYU1ofJieGOm5fiURl1WtfSv3W_4KZhV1191DjgnNC3q9fz2"
          }

          Write-Host "Baixando Ngrok..."
          Invoke-WebRequest -Uri "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip" -OutFile "ngrok.zip"
          Expand-Archive -Path "ngrok.zip" -DestinationPath . -Force
          .\ngrok.exe authtoken $ngrokToken
          Start-Process -FilePath "powershell" -ArgumentList "-NoExit", "-Command", ".\ngrok.exe tcp 3389"
          Start-Sleep -Seconds 12

          $endpoint = ""
          try {
              $tunnels = (Invoke-RestMethod -Uri "http://127.0.0.1:4040/api/tunnels").tunnels
              $publicUrl = $tunnels[0].public_url
              $endpoint = $publicUrl -replace 'tcp://', ''
              Write-Host "=========================================="
              Write-Host ">>>VANTA_RDP_ENDPOINT: $endpoint<<<"
              Write-Host "=========================================="
          } catch {
              Write-Host "Falha ao obter URL via Ngrok local."
          }

          if ($endpoint -ne "") {
              $data = @{
                  vm_id = $vmId
                  endpoint = $endpoint
                  status = "online"
                  updated_at = (Get-Date).ToString("yyyy-MM-dd HH:mm:ss")
              } | ConvertTo-Json

              Set-Content -Path "endpoint.json" -Value $data

              try {
                  git config --global user.name "Vanta Bot"
                  git config --global user.email "vanta@actions.github.com"
                  git add endpoint.json
                  git commit -m "Update RDP endpoint $endpoint [skip ci]"
                  git push origin main
                  Write-Host "Arquivo endpoint.json atualizado no repositório com sucesso!"
              } catch {
                  Write-Host "Aviso ao fazer commit do endpoint: $_"
              }

              # Adicionar ao Resumo do GitHub
              "### 🚀 VANTA Cloud VM Online!" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
              "- **Host RDP**: `$endpoint`" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
              "- **Usuário**: `runneradmin`" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
              "- **Senha**: `${{ github.event.inputs.vm_password }}`" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }

      - name: Manter Máquina Virtual Ativa (Até 6 Horas)
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "MÁQUINA VIRTUAL EM EXECUÇÃO (6 HORAS MÁXIMO)"
          Write-Host "=========================================="
          $timeout = 21600
          for ($i = 0; $i -lt $timeout; $i += 60) {
              Start-Sleep -Seconds 60
              Write-Host "[VANTA] VM ativa... ($i s decorridos)"
          }
